# EnotDesk одним стеком: enotdesk (сервер) + coturn (TURN) + caddy (авто-HTTPS).
# Быстрый старт за 5 минут: docker/README.md. Переменные — в .env (шаблон .env.example).

name: enotdesk

# Общий хардненинг контейнеров (см. комментарии у сервисов):
# - read_only: корневая ФС только для чтения, запись — только в томах и tmpfs;
# - cap_drop: ALL + только нужные capability (caddy: NET_BIND_SERVICE для 80/443;
#   enotdesk и coturn слушают порты >1024 — capability не нужны);
# - no-new-privileges: процессы не поднимают привилегии через suid/файлы.
# Секреты (TURN_SECRET) нигде не попадают в argv: coturn читает их из
# конфиг-файла, который его entrypoint генерирует в tmpfs (docker/coturn/entrypoint.sh).

x-hardening: &hardening
  read_only: true
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true

services:
  enotdesk:
    build: .
    image: enotdesk-server:local
    restart: unless-stopped
    # Замечание: coturn работает в network_mode: host (см. ниже), поэтому прямых
    # зависимостей по сети нет; caddy ждёт старта enotdesk.
    <<: *hardening
    tmpfs:
      - /tmp
    environment:
      ENOT_HOST: 0.0.0.0
      ENOT_PORT: 8080
      ENOT_DB: /data/enotdesk.db
      ENOT_DIST_DIR: /data/dist
      DOMAIN: ${DOMAIN:-}
      ENOT_PUBLIC_URL: ${ENOT_PUBLIC_URL:-}
      ENOT_TURN_URLS: ${ENOT_TURN_URLS:-}
      ENOT_TURN_USERNAME: ${TURN_USERNAME:-}
      ENOT_TURN_PASSWORD: ${TURN_PASSWORD:-}
      # Секрет уходит и серверу (эфемерные TURN-креды из ENOT_TURN_SECRET, server/),
      # и контейнеру coturn — оба через окружение контейнера, не через argv.
      ENOT_TURN_SECRET: ${TURN_SECRET:?Задай TURN_SECRET в .env — секрет TURN-сервера, см. .env.example}
      # Ключ шифрования 2FA/webhook-секретов и доверенные обратные прокси: пустые =
      # прежнее поведение (шифрование недоступно / X-Forwarded-For не доверяется);
      # читаются app.mjs и main.mjs из окружения процесса, не из argv.
      ENOT_SECRET_KEY: ${ENOT_SECRET_KEY:-}
      ENOT_TRUSTED_PROXY: ${ENOT_TRUSTED_PROXY:-}
    volumes:
      - enotdesk-data:/data
      - enotdesk-dist:/data/dist
    ports:
      # Только loopback: админ может проверить health снаружи контейнера;
      # наружу сервер отдаётся через caddy (80/443), напрямую 8080 не публикуем.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then((r)=>{if(!r.ok)throw new Error('not ok')}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  hub:
    # EnotDesk Hub — тикет-система + чат-виджет (ADR 0023), тот же образ, своя БД.
    # Включается профилем: COMPOSE_PROFILES=hub в .env (quick-setup пишет сам при HUB=1).
    # Наружу порт НЕ публикуется — /hub/, /widget.js, /w, /join, /api/hub/* отдаёт Caddy.
    profiles: ["hub"]
    build: .
    image: enotdesk-server:local
    restart: unless-stopped
    <<: *hardening
    tmpfs:
      - /tmp
    depends_on:
      enotdesk:
        condition: service_healthy
    environment:
      ENOT_HUB_HOST: 0.0.0.0
      ENOT_HUB_PORT: 8090
      ENOT_HUB_DB: /data/hub.db
      # SSO: логин хаба проксируется в EnotDesk (health тоже считается от него)
      ENOTDESK_URL: http://enotdesk:8080
      HUB_URL: ${HUB_URL:-}
      ENOT_SECRET_KEY: ${ENOT_SECRET_KEY:-}
      # Доверенный прокси (Caddy): без него X-Forwarded-For не принимается и
      # лимит логина считается по адресу контейнера caddy (см. .env.example)
      ENOT_TRUSTED_PROXY: ${ENOT_TRUSTED_PROXY:-}
    volumes:
      - hub-data:/data

  coturn:
    # TURN из коробки (история 4): static-auth-secret из env, realm из DOMAIN.
    # Секрет НЕ передаётся через argv (виден в docker inspect/ps): entrypoint
    # генерирует /run/turnserver.conf (tmpfs, 0600), turnserver читает его флагом -c.
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    # host-сеть: релейные кандидаты обязаны видеть внешний адрес машины,
    # проброс портов контейнера для TURN не работает без --external-ip.
    # Требование: Linux-хост (VPS). На Docker Desktop может не релеить — честно см. docker/README.md.
    network_mode: host
    <<: *hardening
    # Файл-capability cap_net_bind_service=ep, зашитая в бинарник turnserver
    # официальным образом (для дефолтного порта 443), требует её же в bounding-set
    # контейнера — иначе exec EPERM. Наши порты (3478, 49160+) >1024 — для
    # привязки capability не используется, но без неё процесс не стартует.
    cap_add:
      - "NET_BIND_SERVICE"
    tmpfs:
      # Конфиг с секретом и pid-файл живут только в памяти (alpine: /var/run → /run).
      # uid/gid — nobody контейнера coturn (образ по умолчанию работает как nobody).
      - /run:mode=0700,uid=65534,gid=65533
    environment:
      TURN_SECRET: ${TURN_SECRET:?Задай TURN_SECRET в .env — секрет TURN-сервера, см. .env.example}
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./docker/coturn/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]

  caddy:
    # Авто-TLS (Let's Encrypt) при заданном DOMAIN; без домена — HTTP :80 с честным
    # предупреждением в логах (docker/caddy/entrypoint.sh).
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - enotdesk
    <<: *hardening
    # 80/443 — привилегированные порты, иначе cap_drop: ALL и не нужно ничего.
    cap_add:
      - "NET_BIND_SERVICE"
    tmpfs:
      - /tmp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
      # Hub включён — Caddy добавляет маршруты /hub, /widget.js, /w, /join, /api/hub/*
      HUB: ${HUB:-}
    volumes:
      - ./docker/caddy/entrypoint.sh:/entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    entrypoint: ["sh", "/entrypoint.sh"]

volumes:
  enotdesk-data:
  enotdesk-dist:
  hub-data:
  caddy-data:
  caddy-config:
