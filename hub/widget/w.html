<!doctype html>
<html lang="__LOCALE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnotDesk</title>
<style>
:root{color-scheme:dark;--bg:#070D17;--panel:#0F1A2C;--line:#1C2C44;--text:#EAF2FF;--muted:#8FA3BF;--accent:#35E0C4;--danger:#FF7A7A;--in:#14243C;--out:#0E2E29}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.hidden{display:none!important}
.w-status{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px;flex:none}
.w-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.w-dot.online{background:var(--accent)}
.w-dot.away{background:#F2C94C}
.w-dot.connecting{background:#7CB9FF}
#w-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:86%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.bubble.contact{align-self:flex-end;background:var(--out);border-color:#1F4A42}
.bubble.agent{align-self:flex-start;background:var(--in)}
.bubble.system{align-self:center;background:transparent;color:var(--muted);font-size:13px;max-width:100%}
#w-typing{color:var(--muted);font-size:13px;padding:0 14px 6px;flex:none}
.w-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);flex:none}
.w-form input,.w-form textarea{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;min-width:0}
input:focus,textarea:focus,button:focus-visible{outline:1px solid var(--accent)}
.w-form input{flex:1}
button{font:inherit}
.w-btn{background:var(--accent);border:1px solid var(--accent);color:#05231D;font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer}
.w-btn:disabled{opacity:.55;cursor:default}
.w-btn.ghost{background:transparent;color:var(--text);border-color:#2B3D5E}
.w-panel{display:flex;flex-direction:column;gap:10px;padding:16px 14px;overflow-y:auto}
.w-panel .lead{color:var(--muted);margin:0}
.w-panel input,.w-panel textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.w-panel textarea{resize:vertical;min-height:84px}
.w-consent{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:13px}
.w-consent input{width:auto;margin-top:2px}
.w-consent a{color:var(--accent)}
.w-error{color:var(--danger);min-height:1.2em;margin:0;font-size:13px}
.w-done{color:var(--accent);margin:0}
#w-rating-stars{display:flex;gap:6px}
#w-rating-stars button{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:20px;padding:6px 12px;border-radius:10px;cursor:pointer}
#w-rating-stars button:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:480px){
  html,body{height:100%}
}
</style>
</head>
<body>
<div id="w-root" class="hidden">
  <div id="w-status" role="status">
    <span id="w-status-dot" class="w-dot"></span>
    <span id="w-status-text" data-i18n="widget.status.connecting"></span>
  </div>

  <div id="w-chat" class="hidden" aria-live="polite">
    <div id="w-msgs" role="log"></div>
    <div id="w-typing" class="hidden" data-i18n="widget.typing"></div>
    <form id="w-form" class="w-form">
      <input id="w-input" data-i18n-placeholder="widget.input.placeholder" maxlength="8000" autocomplete="off">
      <button id="w-send" class="w-btn" type="submit" data-i18n="widget.send"></button>
    </form>
  </div>

  <form id="w-prechat" class="w-panel hidden">
    <p class="lead" id="w-prechat-lead" data-i18n="widget.prechat.lead"></p>
    <input id="w-name" data-i18n-placeholder="widget.prechat.name" maxlength="120" autocomplete="name">
    <input id="w-email" type="email" data-i18n-placeholder="widget.prechat.email" maxlength="200" autocomplete="email">
    <label class="w-consent hidden" id="w-consent-row">
      <input type="checkbox" id="w-consent">
      <span><span data-i18n="widget.prechat.consent"></span> <a id="w-policy" class="hidden" target="_blank" rel="noopener noreferrer" data-i18n="widget.prechat.policy"></a></span>
    </label>
    <p class="w-error" id="w-prechat-error" role="alert"></p>
    <button id="w-prechat-start" class="w-btn" type="submit" data-i18n="widget.prechat.start"></button>
  </form>

  <form id="w-offline" class="w-panel hidden">
    <p class="lead" id="w-offline-lead" data-i18n="widget.offline.lead"></p>
    <input id="w-offline-subject" required maxlength="200" data-i18n-placeholder="widget.offline.subject">
    <input id="w-offline-email" type="email" required maxlength="200" data-i18n-placeholder="widget.offline.email">
    <textarea id="w-offline-text" required maxlength="8000" data-i18n-placeholder="widget.offline.text"></textarea>
    <p class="w-error" id="w-offline-error" role="alert"></p>
    <button id="w-offline-send" class="w-btn" type="submit" data-i18n="widget.offline.send"></button>
  </form>

  <div id="w-offline-done" class="w-panel hidden">
    <p class="w-done" data-i18n="widget.offline.done"></p>
  </div>

  <div id="w-rating" class="w-panel hidden">
    <p class="lead" id="w-rating-lead" data-i18n="widget.rating.lead"></p>
    <div id="w-rating-stars">
      <button type="button" id="w-star-1" data-star="1" aria-label="1">★</button>
      <button type="button" id="w-star-2" data-star="2" aria-label="2">★</button>
      <button type="button" id="w-star-3" data-star="3" aria-label="3">★</button>
      <button type="button" id="w-star-4" data-star="4" aria-label="4">★</button>
      <button type="button" id="w-star-5" data-star="5" aria-label="5">★</button>
    </div>
    <p class="w-done hidden" id="w-rating-done" data-i18n="widget.rating.done"></p>
    <p class="w-error" id="w-rating-error" role="alert"></p>
  </div>

  <p class="w-error" id="w-error" role="alert"></p>
</div>
<script type="module" src="/hub/widget/w.mjs"></script>
</body>
</html>
