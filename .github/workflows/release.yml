# Релизы (истории 33-36): пуш тега v* → три платформы → артефакты + SHA256 → GitHub Release.
# Этот же workflow — источник фида автообновления: рядом с артефактами уходят
# latest.yml / latest-linux.yml (их пишет electron-builder, когда задан
# publish.provider=generic; URL фида = .../releases/latest/download/), а клиент
# (client/main.mjs startUpdater) читает их generic-провайдером electron-updater.
# latest-mac.yml НЕ публикуется (22.10.2026): неподписанный mac самообновиться не
# может (Squirrel.Mac), прежние 0.6.x по нему скачивали обновление, закрывались и
# снова стартовали старой версией. Mac узнаёт версию из latest.yml и показывает
# уведомление (client/lib/updater.mjs notifyFeedName). Подписанной сборке — новый
# канал с другим именем фида, чтобы старые клиенты его не видели.
# Сборки НЕ подписаны (бюджета на сертификаты нет) — запуск без подписи описан в
# README «Unsigned builds» и в теле релиза; блок подписи ниже закомментирован и
# включается без переделки (история 36).
# + серверный тарболл enotdesk-server.tar.gz (job server-tarball, без Node):
# состав = scripts/deploy-server.sh; чексумма попадает в checksums-sha256.txt
# автоматически — шаг релиза считает sha256 по всем файлам в dist/.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # падение одной платформы не топит артефакты остальных
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # фид автообновления живёт по постоянному адресу последнего релиза этого репозитория
      ENOT_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # версия артефактов и фида = тег (в package.json в ветке может отставать);
      # --no-git-tag-version: правим только рабочую копию перед сборкой
      - name: Sync version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Pack (macOS, zip and dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: npx electron-builder --config build/electron-builder.yml -c.publish.provider=generic -c.publish.url="$ENOT_FEED_URL" --mac --publish never
      - name: Build video helper (Windows, ADR 0027)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-msvc
          # Статический CRT (этап 4, 06.10): с динамическим vcruntime140.dll хелпер
          # на Windows без VC++ Redistributable умирает при загрузке молча
          # (STATUS_DLL_NOT_FOUND 0xC0000135), пайп не создаётся — оператор видит
          # только pipe-error. Требование: «работает на любой популярной Windows».
          RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --manifest-path helper/video/Cargo.toml
          mkdir -p helper/video/bin
          cp helper/video/target/release/enotdesk-video.exe helper/video/bin/enotdesk-video.exe
      - name: Pack (Windows — portable и установщик NSIS)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx electron-builder --config build/electron-builder.yml -c.publish.provider=generic -c.publish.url="$ENOT_FEED_URL" --win portable --publish never
          npx electron-builder --config build/electron-builder.yml -c.publish.provider=generic -c.publish.url="$ENOT_FEED_URL" --win nsis --publish never
      # Гейт артефакта (лаба 05.10 + ревизия 06.10): «пустое окно» на не-русских
      # Windows = в сборке нет ни одного подходящего pak. Контракт на yml не
      # видит реальную сборку — проверяем unpacked-каталог, иначе job падает.
      - name: "Gate: locales en-US.pak + ru.pak в сборке"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -f dist/win-unpacked/locales/en-US.pak
          test -f dist/win-unpacked/locales/ru.pak
      - name: Pack (Linux, AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npx electron-builder --config build/electron-builder.yml -c.publish.provider=generic -c.publish.url="$ENOT_FEED_URL" --linux --publish never
          # Постоянное имя для ссылок витрины (releases/latest/download/…): с 0.6.19
          # AppImage несёт версию в имени, и ссылка без версии отдавала 404.
          # Фид latest-linux.yml по-прежнему указывает на версионный файл.
          cp dist/EnotDesk-*-linux-x86_64.AppImage dist/EnotDesk-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/EnotDesk-*
            dist/latest.yml
            dist/latest-linux.yml

  # Серверный тарболл для install-server.sh — параллельно с matrix-сборками;
  # tar есть на раннере из коробки, Node не нужен. Имя артефекта dist-server-tarball
  # попадает под pattern dist-* шага download-artifact релиза и мержится в dist/.
  server-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Версия артефакта = тег (как в matrix-сборках), но без npm: job сознательно
      # без Node, а npm version требует npm. В package.json ровно одно поле
      # "version" — sed меняет его на тот же формат; package-lock.json не трогаем
      # (npm ci в install-server.sh сверяет дерево зависимостей, не корневую версию).
      - name: Sync version from tag
        shell: bash
        run: |
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${GITHUB_REF_NAME#v}\"/" package.json
      - name: Pack server tarball (состав = scripts/deploy-server.sh)
        shell: bash
        run: tar -czf enotdesk-server.tar.gz server hub assets web package.json package-lock.json scripts/install-server.sh client/lib client/renderer client/locales
      - uses: actions/upload-artifact@v6
        with:
          name: dist-server-tarball
          if-no-files-found: error
          path: enotdesk-server.tar.gz

  release:
    needs: [build, server-tarball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: checksums-sha256.txt
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'builder-debug.yml' ! -name 'checksums-sha256.txt' -print0 \
            | sort -z | xargs -0 sha256sum > checksums-sha256.txt
          cat checksums-sha256.txt

      # ==== Подпись (история 36): включается позже, без переделки workflow ====
      #
      # macOS — Developer ID Application + нотаризация:
      #   1. Секреты репозитория: MAC_CERTS (P12 в base64),
      #      MAC_CERTS_PASSWORD (пароль P12), APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD
      #      (пароль приложения из appleid.apple.com), APPLE_TEAM_ID.
      #   2. Раскомментировать два шага ниже; electron-builder сам подпишет
      #      (CSC_LINK) и отправит на нотаризацию (notarize: true).
      #
      # Windows — Authenticode:
      #   1. Секреты репозитория: WINDOWS_CERTIFICATE (PFX в base64),
      #      WINDOWS_CERTIFICATE_PASSWORD (пароль PFX).
      #   2. Раскомментировать шаг импорта; electron-builder найдёт сертификат
      #      в хранилище и подпишет portable exe.
      #
      # - name: Import macOS signing certificate
      #   if: runner.os == 'macOS'
      #   env:
      #     MAC_CERTS: ${{ secrets.MAC_CERTS }}
      #     MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
      #   run: |
      #     echo "$MAC_CERTS" | base64 --decode > signing.p12
      #     security create-keychain -p build build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p build build.keychain
      #     security import signing.p12 -k build.keychain -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
      # - name: Import Windows signing certificate
      #   if: runner.os == 'Windows'
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #   shell: pwsh
      #   run: |
      #     $pfx = [IO.Path]::GetTempFileName()
      #     [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
      #     Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\My -Password (ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force)
      #     Remove-Item $pfx
      #
      # В шагах Pack (macOS) при этом добавить флаги окружения:
      #   CSC_LINK: ${{ secrets.MAC_CERTS }}
      #   CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
      #   APPLE_ID: ${{ secrets.APPLE_ID }}
      #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Windows portable не пишет latest.yml — фид опционален, win-клиент на notify-only
          fail_on_unmatched_files: false
          generate_release_notes: true
          # история 35: инструкции запуска неподписанной сборки — в описании релиза
          body: |
            Линия **0.6.x — «Кроха»** (codename **Crumb**). The 0.6.x release line is codenamed **Crumb** («Кроха»).

            **Без подписи — как запустить**

            - **macOS**: `EnotDesk-mac-arm64.dmg` — **установщик**: откройте и перетащите EnotDesk в «Программы»; `EnotDesk-mac-arm64.zip` — портативная версия. При первом запуске macOS скажет, что не может проверить разработчика: нажмите «Готово», откройте «Системные настройки» → «Конфиденциальность и безопасность», внизу — «Всё равно открыть» для EnotDesk и подтвердите (на macOS 14 и старше работает и правая кнопка → «Открыть»; либо `xattr -cr /Applications/EnotDesk.app`). Затем разрешите «Запись экрана» и «Универсальный доступ». Новые версии Mac-сборка не ставит сама — она сообщает о них, а скачать нужно отсюда.
            - **Windows**: SmartScreen → «Подробнее» → «Выполнить в любом случае».
              - `EnotDesk-win-x64.exe` — **портативная** версия: один файл, без установки, запуск двойным кликом.
              - `EnotDesk-win-x64-setup.exe` — **установщик**: ставит программу в систему (Program Files), создаёт ярлыки.
            - **Linux**: `chmod +x EnotDesk-linux-*.AppImage` и запустите двойным кликом.

            EN:
            - **macOS**: `EnotDesk-mac-arm64.dmg` — **installer**: open it and drag EnotDesk to Applications; `EnotDesk-mac-arm64.zip` — portable. On first launch macOS says it cannot verify the developer: click Done, open System Settings → Privacy & Security, scroll down to “Open Anyway” for EnotDesk and confirm (on macOS 14 and older right-click → Open also works; or `xattr -cr /Applications/EnotDesk.app`). Then grant Screen Recording and Accessibility. The Mac build does not install new versions by itself — it tells you about them; download them here.
            - **Windows**: SmartScreen → More info → Run anyway.
              - `EnotDesk-win-x64.exe` — **portable**: single file, no installation, just run it.
              - `EnotDesk-win-x64-setup.exe` — **installer**: installs to the system (Program Files) with shortcuts.
            - **Linux**: `chmod +x EnotDesk-linux-*.AppImage` and run it.

            Целостность: `sha256sum -c checksums-sha256.txt`. Клиент проверяет обновление раз в сутки по фиду этого релиза (latest.yml / latest-linux.yml); установленная Windows-сборка и Linux обновляются сами после подтверждения, Windows portable и macOS — скачиванием новой версии со страницы релизов.
          files: |
            dist/EnotDesk-*
            dist/enotdesk-server.tar.gz
            dist/checksums-sha256.txt
            dist/latest.yml
            dist/latest-linux.yml
