name: Linux Guest Pilot

on:
  workflow_dispatch:
  push:
    branches: [guest-edition]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            output: linux-unpacked
          - runner: ubuntu-24.04-arm
            arch: arm64
            output: linux-arm64-unpacked
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pack the portable client
        run: npm run pack:linux -- dir --${{ matrix.arch }} --publish never
      - name: Check the native input library
        run: test -f dist/${{ matrix.output }}/resources/app.asar.unpacked/node_modules/@koromix/koffi-linux-${{ matrix.arch }}/linux_${{ matrix.arch }}/koffi.node
      - name: Install X11 test environment
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libxtst6
      - name: Smoke test
        run: xvfb-run -a node scripts/smoke-artifact.mjs dist/${{ matrix.output }}/enotdesk-guest-pilot --no-sandbox --disable-gpu
      - name: Archive client
        env:
          ARCH: ${{ matrix.arch }}
          OUTPUT: ${{ matrix.output }}
        run: |
          version="$(node -p "require('./package.json').version")"
          artifact="EnotDesk-Guest-Pilot-${version}-linux-${ARCH}.tar.gz"
          tar -C dist -czf "$artifact" "$OUTPUT"
          sha256sum "$artifact" > "$artifact.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: EnotDesk-Guest-Pilot-linux-${{ matrix.arch }}
          path: EnotDesk-Guest-Pilot-*.tar.gz*
          retention-days: 14
          if-no-files-found: error
