appId: com.enotdesk.app
productName: EnotDesk
directories:
  output: dist
files:
  - client/**/*
  - assets/**/*
asarUnpack:
  - node_modules/koffi/**
artifactName: "EnotDesk-${os}-${arch}.${ext}"
mac:
  target:
    - zip
  category: public.app-category.utilities
  icon: assets/icon.icns
  identity: null
win:
  target:
    - portable
  icon: assets/icon.ico
linux:
  target:
    - AppImage
  icon: assets/icon.png
  category: Utility
