appId: com.enotdesk.app
productName: EnotDesk
compression: maximum
electronLanguages:
  # ВНИМАНИЕ (лаба 05.10): только полные теги. «en» не матчится ни с одним
  # pak-файлом и выпадает из сборки — у Windows с локалью, отличной от ru, не
  # остаётся НИ ОДНОГО языкового пака, ResourceBundle пуст, а рендерер падает
  # Access Violation (0xC0000005) при создании <input type=file>/<details>/<video>
  # (им нужны локализованные строки Chromium). Пустое окно клиента на en-US ВМ.
  - ru
  - en-US
directories:
  output: dist
files:
  - client/**/*
  - "!client/test/**"
  - "!**/.DS_Store"
  # Бренд-лого (10.10): WebP вместо PNG — визуально 1:1, в бандле в 4 раза легче
  - assets/mascot-app.webp
  - assets/mascot-mini.webp
  # иконка для Linux-ярлыка (client/lib/desktop-entry.mjs копирует её в
  # ~/.local/share/icons при старте упакованного десктоп-приложения)
  - assets/icon.png
  # шрифт Inter для интерфейса («Neon Emerald», 20.10): два woff2 ≈ 120 КБ
  - assets/inter-cyrillic.woff2
  - assets/inter-latin.woff2
  - package.json
  # Срез мёртвого груза koffi (R01): C++-исходники, vendor-заголовки, doc.
  # Рантайму нужны index.cjs -> src/koffi/index.cjs -> src/koffi/src/static.cjs
  # и бинарник @koromix/koffi-<platform> — JS-рантайм реинклюдится после src/**.
  - "!node_modules/koffi/src/**"
  - "!node_modules/koffi/vendor/**"
  - "!node_modules/koffi/doc/**"
  - "node_modules/koffi/src/koffi/*.cjs"
  - "node_modules/koffi/src/koffi/*.js"
  - "node_modules/koffi/src/koffi/src/*.cjs"
  - "node_modules/koffi/src/koffi/src/*.js"
  # Диета asar (волна 0.6.19): серверно-почтовое дерево (imapflow/nodemailer —
  # зависимости hub, лениво импортируются только hub/email.mjs; в клиентском
  # asar не нужны НИКОГДА). Клиенту из prod-зависимостей нужны только ws,
  # koffi и electron-updater (его дерево: js-yaml+argparse, fs-extra+…,
  # tiny-typed-emitter, builder-util-runtime+sax — НЕ исключать, проверено
  # npm ls; sax нужен updater'у через builder-util-runtime).
  # Паттерны в конце: последний совпавший побеждает (ловушка koffi-реинклюдов).
  - "!node_modules/imapflow/**"
  - "!node_modules/nodemailer/**"
  - "!node_modules/encoding-japanese/**"
  - "!node_modules/iconv-lite/**"
  - "!node_modules/libbase64/**"
  - "!node_modules/libmime/**"
  - "!node_modules/libqp/**"
  - "!node_modules/@zone-eu/**"
  - "!node_modules/socks/**"
  - "!node_modules/smart-buffer/**"
  - "!node_modules/ip-address/**"
  - "!node_modules/safer-buffer/**"
  - "!node_modules/pino/**"
  - "!node_modules/pino-abstract-transport/**"
  - "!node_modules/pino-std-serializers/**"
  - "!node_modules/quick-format-unescaped/**"
  - "!node_modules/safe-stable-stringify/**"
  - "!node_modules/sonic-boom/**"
  - "!node_modules/thread-stream/**"
  - "!node_modules/real-require/**"
  - "!node_modules/split2/**"
  - "!node_modules/atomic-sleep/**"
  - "!node_modules/process-warning/**"
  - "!node_modules/on-exit-leak-free/**"
  - "!node_modules/@pinojs/**"
asarUnpack:
  - node_modules/koffi/**
# Видео-хелпер (ADR 0027, v0.6): нативный exe собирается отдельно (helper/video,
# cargo build --release на Windows; release-воркфлоу делает это перед упаковкой)
# и кладётся в resources — его запускает служба в консольном сеансе, asar не нужен.
# Осознанное отступление от ADR 0011 («asarUnpack только для koffi»): хелпер —
# отдельный бинарник вне asar. На ОС без helper/video/bin сборка идёт без хелпера
# (клиент честно репортит spawn-bad-exe — machine-сеанс живёт без видео).
extraResources:
  - from: helper/video/bin
    to: .
    filter:
      - enotdesk-video.exe
artifactName: "EnotDesk-${os}-${arch}.${ext}"
# Вшитый адрес сервера (R03): значение попадает в package.json внутри app.asar,
# клиент читает его как baked (client/lib/first-run.mjs: pkg → process.env →
# порядок saved → файл → baked → дефолт). ВАЖНО: макрос ${env.*} electron-builder
# раскрывает только в file patterns / artifactName / publish url — в extraMetadata
# он остаётся литералом (проверено сборкой 26.15.3), поэтому адрес задаётся так:
#   статически:   ENOT_BAKED_SERVER_URL: https://enot.example.com
#   при сборке:   ENOT_BAKED_SERVER_URL=https://demo.example \
#                 npx electron-builder --config build/electron-builder.yml \
#                   -c.extraMetadata.ENOT_BAKED_SERVER_URL="$ENOT_BAKED_SERVER_URL" ...
# Пустая строка (по умолчанию) = «не задано»: клиент честно уходит в следующий
# источник резолва.
extraMetadata:
  ENOT_BAKED_SERVER_URL: ""
# One-click (R04): протокол enotdesk://join. Регистрируется в упаковке на всех
# трёх ОС (mac: CFBundleURLTypes в Info.plist; win: реестр; linux: MimeType
# x-scheme-handler в .desktop). В рантайме mac дополнительно требует
# app.setAsDefaultProtocolClient (client/main.mjs, только не-SMOKE/не-агент).
protocols:
  - name: EnotDesk Help
    schemes:
      - enotdesk
mac:
  # zip — портативная версия (latest-mac.yml в релиз не публикуется: неподписанный mac не самообновляется, см. release.yml);
  # dmg — установщик «перетащите в Программы» (запрос владельца 20.10)
  target:
    - zip
    - dmg
  category: public.app-category.utilities
  icon: assets/icon.icns
  identity: null
  # ВНИМАНИЕ: НЕ добавлять сюда files: — платформенный files подмешивает
  # дефолт **/*, и в asar уезжает весь репозиторий (живой инцидент волны
  # 0.6.19: helper 323 МБ + graphify-out + отчёты в сборке). Поэтому чужие
  # платформенные koffi-нативы (~1 МБ) осознанно едут в сборке: глобальный
  # files платформо-независим, а платформенные files здесь запрещены.
win:
  target:
    - portable
  icon: assets/icon.ico
portable:
  # Скорость запуска (21.10, ветка startup-speed): портативка при КАЖДОМ запуске
  # распаковывает всё приложение (~330 МБ, 41 файл) во временную папку — это
  # главная задержка старта. Замер на ВМ лабы (Xeon E5-2670 v2, Defender вкл.):
  #   7z/LZMA (compression: maximum, как сейчас) — 90 МБ, старт 12–24 с (медиана ~20);
  #   useZip: true (zlib без «солида»)           — 141 МБ, старт 10–19 с (медиана ~12).
  # useZip НЕ включён: +51 МБ скачивания съедают выигрыш на медленном интернете,
  # а портативку обычно запускают один раз на сеанс помощи. Решение можно
  # переиграть одной строкой (useZip: true), цифры выше — основа.
  # Заставка на время распаковки (scripts/make-splash.mjs): человек сразу видит,
  # что программа запускается, а не жмёт ярлык второй раз.
  splashImage: build/portable-splash.bmp
nsis:
  # установщик: ярлык на рабочем столе + в «Пуск», деинсталляция в системе;
  # своё имя артефакта — иначе перезаписал бы portable (EnotDesk-win-x64.exe).
  # Собирается отдельным вызовом electron-builder --win nsis (release.yml).
  oneClick: true
  # per-machine установка в Program Files с elevation, а не per-user в
  # %LOCALAPPDATA%\Programs (живой сеанс 28.09: владелец ожидал системную
  # установку; служба агента также ожидает стабильный системный путь).
  perMachine: true
  # Служба EnotDeskAgent держит EnotDesk.exe из Program Files круглосуточно:
  # без хуков ниже тихое обновление могло проиграть SCM-перезапуску службы
  # гонку за файлы (находка 10.10.2026), а после установки служба оставалась
  # убитой. customInit: sc stop до копирования; customInstall: sc start;
  # customUnInstall: stop + delete.
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: EnotDesk-win-x64-setup.${ext}
linux:
  target:
    - AppImage
  icon: assets/icon.png
  category: Utility
  # версия в имени: «EnotDesk-linux-x86_64.AppImage» без версии путался при
  # ручном скачивании нескольких релизов (замечание владельца 10.10). Фид
  # latest-linux.yml ссылается на фактическое имя — обновление не ломается.
  artifactName: "EnotDesk-${version}-linux-${arch}.${ext}"
