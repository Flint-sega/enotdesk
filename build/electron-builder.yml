appId: com.enotdesk.app
productName: EnotDesk
compression: maximum
electronLanguages:
  - ru
  - en
directories:
  output: dist
files:
  - client/**/*
  - "!client/test/**"
  - "!**/.DS_Store"
  - assets/enot-icon.svg
  - assets/enot-mascot.svg
  - assets/mascot-app.png
  - package.json
asarUnpack:
  - node_modules/koffi/**
artifactName: "EnotDesk-${os}-${arch}.${ext}"
mac:
  target:
    - zip
  category: public.app-category.utilities
  icon: assets/icon.icns
  identity: null
win:
  target:
    - portable
  icon: assets/icon.ico
linux:
  target:
    - AppImage
  icon: assets/icon.png
  category: Utility
